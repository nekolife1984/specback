name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks (with retry)
        run: |
          set -eo pipefail
          VERSION=$(curl -sSfL --retry 3 --retry-delay 2 https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | cut -d\" -f4)
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')
          for i in 1 2 3; do
            if curl -sSfL --retry 3 --retry-delay 2 "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_${OS}_${ARCH}.tar.gz" | tar xz -C /usr/local/bin gitleaks; then
              gitleaks version && break
            elif [ "$i" -lt 3 ]; then
              echo "gitleaks download failed (attempt $i/3); retrying..." && sleep 5
            else
              echo "gitleaks download failed after 3 attempts" && exit 1
            fi
          done

      - name: Secret scan — gitleaks
        run: |
          gitleaks detect --no-banner --verbose 2>&1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest mypy pytest-cov pytest-xdist ruff
          pip install -r scripts/requirements.txt 2>&1 | tail -3

      - name: Lint — ruff (E4/E7/E9/F)
        run: |
          python -m ruff check scripts/ scripts/source_map_v2/ skills/specback-search/scripts/

      - name: Verify git hooks are valid (syntax check)
        run: |
          bash -n .githooks/pre-commit
          bash -n .githooks/pre-push
          echo "  ✅ Git hook syntax valid"

      - name: Run tests — scripts/ (coverage)
        run: |
          python -m pytest scripts/tests/ -q --tb=short --cov=scripts --cov-append --cov-fail-under=0

      - name: Run tests — source_map_v2/ (coverage)
        run: |
          python -m pytest scripts/source_map_v2/tests/ -q --tb=short --cov=scripts --cov-append --cov-fail-under=0

      - name: Run tests — specback-search skill (coverage)
        run: |
          python -m pytest skills/specback-search/scripts/tests/ -q --tb=short --cov=scripts --cov-append --cov-fail-under=0

      - name: Run tests — combined suite in parallel (pytest-xdist)
        run: |
          python -m pytest scripts/tests/ scripts/source_map_v2/tests/ skills/specback-search/scripts/tests/ -n 2 -q --tb=short

      - name: Coverage report (gate) — enforced on accumulated data
        run: |
          python -m coverage report --skip-covered

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage
          if-no-files-found: warn

      - name: Validate template catalog sync
        run: |
          python3 scripts/validate-template-catalog.py --catalog templates/catalog.json --templates-dir templates

      - name: Type check — mypy
        run: |
          python -m mypy scripts/ \
            --ignore-missing-imports \
            --follow-imports=skip 2>&1

      - name: Smoke import — source_map_v2 module
        run: |
          cd scripts
          python -c "
          import sys
          sys.path.insert(0, '.')
          from source_map_v2 import SCHEMA_VERSION, build_source_map
          from source_map_v2.taxonomy import ROLES, UNIVERSAL_TABLES
          print(f'  ✅ source_map_v2 (schema {SCHEMA_VERSION}, {len(ROLES)} roles)')
          "

      - name: Smoke import — standalone scripts via pytest collect
        run: |
          python -m pytest scripts/tests/ \
            --collect-only -q 2>&1 | tail -5
          echo "  ✅ All test imports resolved"

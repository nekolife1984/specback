[project]
name = "specback"
version = "1.2.0"
description = "Reverse-engineers specification documents from existing codebases"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["specification", "reverse-engineering", "documentation", "legacy", "code-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Code Generators",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# specback はパッケージ化対象なし（ADWスクリプト + ドキュメント群）
[tool.setuptools]
packages = []

[tool.ruff]
preview = false
line-length = 88

[tool.ruff.lint]
# Stable default rules only: pycodestyle error (E4/E7/E9) + pyflakes (F).
# The codebase deliberately uses several noisy rules (BLE001 blind-except,
# PLW1510 subprocess w/o check, DTZ007, B017, etc.) — those are explicitly
# excluded here and out of scope for lint enforcement.
select = ["E4", "E7", "E9", "F"]
ignore = [
    # Module-level import-after-sys.path.insert is a deliberate collection-order
    # pattern used by the test suite (see scripts/tests/test_*.py).
    "E402",
    # Ambiguous `l` loop vars are kept for readability in tests.
    "E741",
    # Intentionally-used noisy rules (out of scope — #322).
    "B017",
    "BLE001",
    "C408",
    "DTZ007",
    "EXE001",
    "FURB167",
    "FURB188",
    "ISC004",
    "PERF102",
    "PIE810",
    "PLC0206",
    "PLW1510",
    "PYI034",
    "RUF022",
    "RUF034",
    "RUF059",
    "RUF100",
    "S110",
    "S112",
    "SIM102",
    "SIM114",
    "TRY004",
    "UP033",
    "UP035",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["scripts/tests", "scripts/source_map_v2/tests", "skills/specback-search/scripts/tests"]

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
# Coverage gate threshold — real branch coverage of the combined suite is ~70%.
# Keep it a few points below the measured value so the gate tracks regressions
# without failing the existing green suite on run-to-run flakiness.
fail_under = 68
show_missing = true
skip_covered = true

[tool.pyrefly]
python-version = "3.11.0"
preset = "legacy"
ignore-missing-imports = ["*"]

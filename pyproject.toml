[project]
name = "specback"
version = "1.2.0"
description = "Reverse-engineers specification documents from existing codebases"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["specification", "reverse-engineering", "documentation", "legacy", "code-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Code Generators",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# specback はパッケージ化対象なし（ADWスクリプト + ドキュメント群）
[tool.setuptools]
packages = []

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["scripts/tests", "scripts/source_map_v2/tests", "skills/specback-search/scripts/tests"]

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
# Coverage gate threshold — real branch coverage of the combined suite is ~70%.
# Keep it a few points below the measured value so the gate tracks regressions
# without failing the existing green suite on run-to-run flakiness.
fail_under = 68
show_missing = true
skip_covered = true
